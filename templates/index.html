<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ipsita-Sathi ❤️</title>
    <style>
        :root {
            --bg: #fdd0e0;
            --card: #ffffff;
            --primary: #e91e63;
            --primary-dark: #c2185b;
            --user-bubble: #fce4ec;
            --bot-bubble: #e91e63;
            --bot-text: #ffffff;
            --input-bg: #fff;
            --input-border: #ccc;
            --text: #333;
            --subtext: #999;
            --chat-bg: #f9f9f9;
            --shadow: rgba(0,0,0,0.1);
        }
        body.dark {
            --bg: #1a0a0f;
            --card: #2a1020;
            --primary: #ff4081;
            --primary-dark: #e91e63;
            --user-bubble: #3d1a2a;
            --bot-bubble: #c2185b;
            --bot-text: #fff;
            --input-bg: #3a1525;
            --input-border: #5a2535;
            --text: #f0d0dc;
            --subtext: #a07080;
            --chat-bg: #221018;
            --shadow: rgba(0,0,0,0.4);
        }
        * { box-sizing: border-box; transition: background-color 0.3s, color 0.3s; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0; padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: var(--card);
            border-radius: 20px;
            box-shadow: 0 4px 20px var(--shadow);
            padding: 20px;
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        h1 { color: var(--primary); font-size: 1.5em; margin: 0; }
        
        /* Mood Styling */
        .mood-buttons { display: flex; overflow-x: auto; gap: 8px; padding-bottom: 10px; margin-bottom: 15px; scrollbar-width: none; }
        .mood-btn {
            flex: 0 0 auto; padding: 8px 12px; border-radius: 15px;
            background: var(--chat-bg); border: 1px solid var(--input-border);
            color: var(--text); cursor: pointer; font-size: 0.9em;
        }
        .mood-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        /* Chat Area */
        .chat-messages {
            height: 350px; overflow-y: auto;
            border: 1px solid var(--input-border);
            padding: 15px; margin-bottom: 15px;
            background-color: var(--chat-bg); border-radius: 15px;
            display: flex; flex-direction: column; gap: 10px;
        }
        .message { max-width: 80%; padding: 10px 15px; border-radius: 15px; font-size: 0.95em; line-height: 1.4; }
        .user-message { background: var(--user-bubble); align-self: flex-end; border-bottom-right-radius: 2px; }
        .bot-message { background: var(--bot-bubble); color: var(--bot-text); align-self: flex-start; border-bottom-left-radius: 2px; }

        /* Inputs */
        .input-row { display: flex; gap: 8px; }
        input[type="text"], input[type="password"] {
            flex: 1; padding: 12px; border-radius: 25px; border: 1px solid var(--input-border);
            background: var(--input-bg); color: var(--text); outline: none;
        }
        .btn-circle { width: 45px; height: 45px; border-radius: 50%; border: none; background: var(--primary); color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        
        #typingIndicator { font-size: 0.8em; color: var(--subtext); text-align: left; margin-bottom: 5px; }
        .bottom-btns { display: flex; gap: 10px; margin-top: 15px; }
        .bottom-btns button { flex: 1; padding: 8px; border-radius: 10px; border: none; background: var(--subtext); color: white; font-size: 0.8em; cursor: pointer; }
        
        /* Modal */
        #memoryModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 100; justify-content: center; align-items: center; }
        #memoryBox { background: var(--card); width: 90%; max-width: 450px; padding: 20px; border-radius: 20px; max-height: 80vh; overflow-y: auto; }
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <h1>Ipsita-Sathi ❤️</h1>
        <button class="btn-circle" style="background:none; color:var(--text); font-size:1.2em;" onclick="toggleNight()">🌙</button>
    </div>

    <!-- Login -->
    <div id="passwordForm">
        <input type="password" id="password" placeholder="Batao tera password kya hai? 😉">
        <button onclick="checkPassword()" style="width:100%; margin-top:10px; padding:12px; border-radius:25px; border:none; background:var(--primary); color:white;">Enter My Heart</button>
    </div>

    <!-- Chat Area -->
    <div id="chatInterface" style="display:none;">
        <div class="mood-buttons">
            <button class="mood-btn active" data-mood="neutral" onclick="setMood(this)">😊 Normal</button>
            <button class="mood-btn" data-mood="happy" onclick="setMood(this)">🥳 Khush</button>
            <button class="mood-btn" data-mood="sad" onclick="setMood(this)">😢 Udaas</button>
            <button class="mood-btn" data-mood="romantic" onclick="setMood(this)">💕 Romantic</button>
            <button class="mood-btn" data-mood="angry" onclick="setMood(this)">😤 Gussa</button>
        </div>

        <div class="chat-messages" id="chatMessages"></div>
        <div id="typingIndicator" style="display:none;">Mayank likh raha hai...</div>

        <div class="input-row">
            <input type="text" id="userInput" placeholder="Kuch bolo na jaan..." onkeypress="if(event.key==='Enter') sendMessage()">
            <button class="btn-circle" onclick="sendMessage()">🚀</button>
        </div>

        <div class="bottom-btns">
            <button onclick="openMemory()">📖 Yaadein</button>
            <button onclick="clearChat()">🗑️ Clear</button>
        </div>
    </div>
</div>

<!-- Modal -->
<div id="memoryModal">
    <div id="memoryBox">
        <h3 style="color:var(--primary)">Puraani Baatein 🔒</h3>
        <div id="memoryContent" style="font-size: 0.85em; text-align: left;"></div>
        <button onclick="closeMemory()" style="margin-top:15px; width:100%; padding:10px; border-radius:10px; border:none; background:var(--primary); color:white;">Close</button>
    </div>
</div>

<script>
    let conversationHistory = [];
    let currentMood = 'neutral';

    function checkPassword() {
        if(document.getElementById('password').value === 'ipsita') {
            document.getElementById('passwordForm').style.display = 'none';
            document.getElementById('chatInterface').style.display = 'block';
            addBotMessage("Hi baby! Mayank is here. Aaj kaisa mood hai?");
        } else {
            alert("Password galat hai! Tum meri Ipsita hi ho na? ❤️");
        }
    }

    function setMood(btn) {
        document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentMood = btn.dataset.mood;
    }

    function addBotMessage(text) {
        const div = document.createElement('div');
        div.className = 'message bot-message';
        div.textContent = text;
        document.getElementById('chatMessages').appendChild(div);
        scrollChat();
    }

    function addUserMessage(text) {
        const div = document.createElement('div');
        div.className = 'message user-message';
        div.textContent = text;
        document.getElementById('chatMessages').appendChild(div);
        scrollChat();
    }

    function scrollChat() {
        const chat = document.getElementById('chatMessages');
        chat.scrollTop = chat.scrollHeight;
    }

    async function sendMessage() {
        const input = document.getElementById('userInput');
        const text = input.value.trim();
        if(!text) return;

        addUserMessage(text);
        input.value = '';
        document.getElementById('typingIndicator').style.display = 'block';

        try {
            const res = await fetch('/api/chat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    message: text,
                    mood: currentMood,
                    history: conversationHistory
                })
            });
            const data = await res.json();
            document.getElementById('typingIndicator').style.display = 'none';
            
            if(data.response) {
                addBotMessage(data.response);
                conversationHistory.push({role: "user", content: text});
                conversationHistory.push({role: "assistant", content: data.response});
                if(conversationHistory.length > 20) conversationHistory.shift();
            }
        } catch(e) {
            document.getElementById('typingIndicator').style.display = 'none';
            addBotMessage("Network issue hai jaan, ek baar firse try karna? ☹️");
        }
    }

    function toggleNight() {
        document.body.classList.toggle('dark');
    }

    function clearChat() {
        document.getElementById('chatMessages').innerHTML = '';
        conversationHistory = [];
    }

    async function openMemory() {
        const pwd = prompt("Enter Memory Password:");
        if(!pwd) return;
        
        document.getElementById('memoryModal').style.display = 'flex';
        document.getElementById('memoryContent').innerHTML = "Loading...";

        const res = await fetch('/api/memory', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({password: pwd})
        });
        const data = await res.json();
        
        if(data.memory) {
            let html = "";
            data.memory.slice().reverse().forEach(m => {
                html += `<div style="border-bottom:1px solid #eee; padding:10px 0;">
                            <b>Ipsita:</b> ${m.Ipsita || m.user}<br>
                            <b style="color:var(--primary)">Mayank:</b> ${m.Mayank || m.bot}
                         </div>`;
            });
            document.getElementById('memoryContent').innerHTML = html || "Abhi koi yaadein nahi hain.";
        } else {
            document.getElementById('memoryContent').innerHTML = "Wrong Password! ❌";
        }
    }

    function closeMemory() {
        document.getElementById('memoryModal').style.display = 'none';
    }
</script>

</body>
</html>
