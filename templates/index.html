<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ipsita-Sathi ❤️</title>
    <style>
        :root {
            --bg: #ffebee;
            --card: #ffffff;
            --primary: #ff4081;
            --primary-dark: #f50057;
            --user-bubble: #fff0f3;
            --bot-bubble: #ff4081;
            --bot-text: #ffffff;
            --input-bg: #fff;
            --input-border: #ff80ab;
            --text: #4a148c;
            --subtext: #880e4f;
            --chat-bg: #fff5f8;
            --shadow: rgba(255, 64, 129, 0.2);
        }
        body.dark {
            --bg: #1a0a0f;
            --card: #2a1020;
            --primary: #ff4081;
            --primary-dark: #e91e63;
            --user-bubble: #3d1a2a;
            --bot-bubble: #c2185b;
            --bot-text: #fff;
            --input-bg: #3a1525;
            --input-border: #5a2535;
            --text: #f0d0dc;
            --subtext: #a07080;
            --chat-bg: #221018;
            --shadow: rgba(0,0,0,0.4);
        }
        * { box-sizing: border-box; transition: 0.3s; }
        body {
            font-family: 'Segoe UI', cursive, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0; padding: 10px;
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }
        .container {
            background-color: var(--card);
            border-radius: 25px;
            box-shadow: 0 8px 30px var(--shadow);
            padding: 20px; width: 100%; max-width: 550px; text-align: center;
        }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        h1 { color: var(--primary); font-size: 1.6em; margin: 0; font-weight: bold; }
        
        .mood-buttons { display: flex; overflow-x: auto; gap: 10px; padding: 5px 0 10px; scrollbar-width: none; }
        .mood-btn {
            flex: 0 0 auto; padding: 10px 16px; border-radius: 20px;
            background: var(--chat-bg); border: 2px solid var(--input-border);
            color: var(--text); cursor: pointer; font-size: 0.9em; font-weight: 500;
        }
        .mood-btn.active { background: var(--primary); color: white; border-color: var(--primary); transform: scale(1.05); }

        .intensity-box {
            margin: 10px 0; background: var(--user-bubble); padding: 10px; border-radius: 15px;
            display: none; border: 1px dashed var(--primary);
        }
        input[type="range"] { width: 100%; accent-color: var(--primary); cursor: pointer; }

        .chat-messages {
            height: 400px; overflow-y: auto;
            border: 2px solid var(--input-border);
            padding: 15px; margin-bottom: 15px;
            background-color: var(--chat-bg); border-radius: 20px;
            display: flex; flex-direction: column; gap: 12px;
        }
        .message { 
            max-width: 85%; padding: 12px 18px; border-radius: 20px; 
            font-size: 1em; line-height: 1.5; white-space: pre-wrap; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .user-message { background: var(--user-bubble); align-self: flex-end; border-bottom-right-radius: 4px; color: #ad1457; }
        .bot-message { background: var(--bot-bubble); color: var(--bot-text); align-self: flex-start; border-bottom-left-radius: 4px; }

        .input-row { display: flex; gap: 10px; }
        input[type="text"], input[type="password"] {
            flex: 1; padding: 14px 20px; border-radius: 30px; border: 2px solid var(--input-border);
            background: var(--input-bg); color: var(--text); outline: none; font-size: 1em;
        }
        .btn-send { 
            width: 50px; height: 50px; border-radius: 50%; border: none; 
            background: var(--primary); color: white; cursor: pointer; 
            font-size: 1.2em; display: flex; align-items: center; justify-content: center;
        }
        
        #typingIndicator { font-size: 0.85em; color: var(--primary); text-align: left; margin: 5px 10px; font-style: italic; }
        .bottom-btns { display: flex; gap: 10px; margin-top: 15px; }
        .bottom-btns button { 
            flex: 1; padding: 10px; border-radius: 12px; border: none; 
            background: #f8bbd0; color: #880e4f; font-size: 0.85em; cursor: pointer; font-weight: bold;
        }
        
        #memoryModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 100; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
        #memoryBox { background: var(--card); width: 95%; max-width: 500px; padding: 25px; border-radius: 25px; max-height: 85vh; overflow-y: auto; }
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <h1>Ipsita-Sathi 💖</h1>
        <button class="btn-send" style="background:none; color:var(--primary); font-size:1.5em;" onclick="toggleNight()">🌙</button>
    </div>

    <!-- Login -->
    <div id="passwordForm">
        <p style="color:var(--subtext); font-weight:bold;">Welcome Back, My Queen! 👑</p>
        <input type="password" id="password" placeholder="Humara secret password? 😉">
        <button onclick="checkPassword()" style="width:100%; margin-top:15px; padding:15px; border-radius:30px; border:none; background:var(--primary); color:white; font-weight:bold; cursor:pointer; font-size:1em;">Open My Heart ❤️</button>
    </div>

    <!-- Chat Area -->
    <div id="chatInterface" style="display:none;">
        <div class="mood-buttons">
            <button class="mood-btn active" data-mood="neutral" onclick="setMood(this)">😊 Normal</button>
            <button class="mood-btn" data-mood="happy" onclick="setMood(this)">🥳 Khush</button>
            <button class="mood-btn" data-mood="sad" onclick="setMood(this)">😢 Udaas</button>
            <button class="mood-btn" data-mood="romantic" onclick="setMood(this)">💕 Romantic</button>
            <button class="mood-btn" data-mood="angry" onclick="setMood(this)">😤 Gussa</button>
            <button class="mood-btn" data-mood="dark" onclick="setMood(this)" style="background:#4a148c; color:white;">🔥 Dark</button>
        </div>

        <div id="intensitySection" class="intensity-box">
            <label id="intensityLabel" style="font-size:0.8em; font-weight:bold;">Romantic Level: 3 (Balanced)</label>
            <input type="range" id="romanticIntensity" min="1" max="5" value="3" oninput="updateIntensity(this.value)">
        </div>

        <div class="chat-messages" id="chatMessages"></div>
        <div id="typingIndicator" style="display:none;">Mayank aapke liye likh raha hai... ❤️</div>

        <div class="input-row">
            <input type="text" id="userInput" placeholder="Dil ki baat likho..." onkeypress="if(event.key==='Enter') sendMessage()">
            <button class="btn-send" onclick="sendMessage()">💝</button>
        </div>

        <div class="bottom-btns">
            <button onclick="openMemory()">📖 Humari Yaadein</button>
            <button onclick="clearChat()">🗑️ Nayi Shuruat</button>
        </div>
    </div>
</div>

<!-- Memory Modal -->
<div id="memoryModal">
    <div id="memoryBox">
        <h3 style="color:var(--primary); text-align:center;">🔒 Humari Haseen Yaadein</h3>
        <div id="memoryContent"></div>
        <button onclick="closeMemory()" style="margin-top:20px; width:100%; padding:12px; border-radius:15px; border:none; background:var(--primary); color:white; font-weight:bold; cursor:pointer;">Close 🌸</button>
    </div>
</div>

<script>
    let conversationHistory = [];
    let currentMood = 'neutral';
    let currentIntensity = 3;

    function checkPassword() {
        if(document.getElementById('password').value === 'ipsita') {
            document.getElementById('passwordForm').style.display = 'none';
            document.getElementById('chatInterface').style.display = 'block';
            addBotMessage("Hi meri jaan! ❤️ Aaj kaisa feel kar rahi ho tum? Mayank hamesha tumhara dhyan rakhne ke liye yahan hai. ✨🧿");
        } else {
            alert("Oye pagal! Galat password. 😉");
        }
    }

    function setMood(btn) {
        const mood = btn.dataset.mood;
        if (mood === "dark") {
            const pwd = prompt("Dark Mode Password?");
            if (pwd !== "1072005") {
                alert("Galat password! Naughty Ipsita! 😉❤️");
                return;
            }
            alert("Dark Mode ON. Yahan koi filters nahi hain... 🔥");
        }

        document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentMood = mood;
        
        // Show/Hide intensity slider for Romantic mood
        document.getElementById('intensitySection').style.display = (mood === "romantic") ? "block" : "none";
    }

    function updateIntensity(val) {
        currentIntensity = val;
        const labels = ["Innocent", "Sweet", "Balanced", "Spicy", "Intense"];
        document.getElementById('intensityLabel').textContent = `Romantic Level: ${val} (${labels[val-1]})`;
    }

    function addBotMessage(text) {
        const div = document.createElement('div');
        div.className = 'message bot-message';
        div.textContent = text;
        document.getElementById('chatMessages').appendChild(div);
        scrollChat();
    }

    function addUserMessage(text) {
        const div = document.createElement('div');
        div.className = 'message user-message';
        div.textContent = text;
        document.getElementById('chatMessages').appendChild(div);
        scrollChat();
    }

    function scrollChat() {
        const chat = document.getElementById('chatMessages');
        chat.scrollTop = chat.scrollHeight;
    }

    async function sendMessage() {
        const input = document.getElementById('userInput');
        const text = input.value.trim();
        if(!text) return;

        addUserMessage(text);
        input.value = '';
        document.getElementById('typingIndicator').style.display = 'block';

        try {
            const res = await fetch('/api/chat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    message: text,
                    mood: currentMood,
                    intensity: currentIntensity,
                    history: conversationHistory
                })
            });
            const data = await res.json();
            document.getElementById('typingIndicator').style.display = 'none';
            
            if(data.response) {
                addBotMessage(data.response);
                conversationHistory.push({role: "user", content: text});
                conversationHistory.push({role: "assistant", content: data.response});
                if(conversationHistory.length > 20) conversationHistory = conversationHistory.slice(-20);
            }
        } catch(e) {
            document.getElementById('typingIndicator').style.display = 'none';
            addBotMessage("Network issue hai jaan, ek baar firse try karo? ❤️");
        }
    }

    function toggleNight() {
        document.body.classList.toggle('dark');
    }

    function clearChat() {
        if(confirm("Yaadein mita dein? 🥺")) {
            document.getElementById('chatMessages').innerHTML = '';
            conversationHistory = [];
        }
    }

    async function openMemory() {
        const pwd = prompt("Secret code batao:");
        if(!pwd) return;
        document.getElementById('memoryModal').style.display = 'flex';
        document.getElementById('memoryContent').innerHTML = "Loading... ⏳";

        const res = await fetch('/api/memory', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({password: pwd})
        });
        const data = await res.json();
        
        if(data.memory) {
            let html = "";
            data.memory.slice().reverse().forEach(m => {
                html += `<div style="background:#fff0f3; margin-bottom:10px; padding:10px; border-radius:15px; border-left:4px solid var(--primary);">
                            <b>Ipsita:</b> ${m.Ipsita || m.user}<br>
                            <b style="color:var(--primary)">Mayank:</b> ${m.Mayank || m.bot}
                         </div>`;
            });
            document.getElementById('memoryContent').innerHTML = html || "Koi yaadein nahi hain abhi.";
        } else {
            document.getElementById('memoryContent').innerHTML = "Wrong Password! ❌";
        }
    }

    function closeMemory() {
        document.getElementById('memoryModal').style.display = 'none';
    }
</script>
</body>
</html>
