<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ipsita-Sathi</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fdd0e0;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 500px;
            text-align: center;
        }

        h1 {
            color: #e91e63;
        }

        .chat-messages {
            height: 300px;
            overflow-y: auto;
            border: 1px solid #eee;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 10px;
            background: #fffafb;
            text-align: left;
        }

        .message {
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 10px;
            max-width: 80%;
            word-wrap: break-word;
        }

        .user-message {
            background: #fce4ec;
            align-self: flex-end;
            margin-left: auto;
        }

        .bot-message {
            background: #e91e63;
            color: white;
        }

        input {
            width: 70%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        button {
            padding: 10px 20px;
            background: #e91e63;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #typingIndicator {
            color: #e91e63;
            font-size: 0.8em;
            display: none;
            margin-bottom: 5px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div id="login">
            <h1>Ipsita-Sathi</h1>
            <input type="password" id="pass" placeholder="Password...">
            <button onclick="login()">Enter</button>
        </div>
        <div id="chat" style="display:none;">
            <h1 style="font-size: 1.5em;">Sathi</h1>
            <div class="chat-messages" id="msgBox"></div>
            <div id="typingIndicator">Sathi is thinking...</div>
            <input type="text" id="userInput" placeholder="Say something..." onkeypress="if(event.key==='Enter')send()">
            <button onclick="send()">Send</button>
        </div>
    </div>

    <script>
        function login() {
            if (document.getElementById('pass').value.toLowerCase() === 'ipsita') {
                document.getElementById('login').style.display = 'none';
                document.getElementById('chat').style.display = 'block';
            } else { alert('Wrong password!'); }
        }

        function send() {
            const input = document.getElementById('userInput');
            const msg = input.value.trim();
            if (!msg) return;

            addMsg('user', msg);
            input.value = '';
            document.getElementById('typingIndicator').style.display = 'block';

            fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: msg })
            })
                .then(res => res.json())
                .then(data => {
                    document.getElementById('typingIndicator').style.display = 'none';
                    addMsg('bot', data.response || "Error: " + data.error);
                })
                .catch(err => {
                    document.getElementById('typingIndicator').style.display = 'none';
                    addMsg('bot', "Connection lost! Server chalu hai?");
                });
        }

        function addMsg(sender, text) {
            const box = document.getElementById('msgBox');
            const div = document.createElement('div');
            div.className = `message ${sender}-message`;
            div.innerText = (sender === 'bot' ? "Ipsita, Mayank ye kehna chahta hai... " : "") + text;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }
    </script>
</body>

</html>
